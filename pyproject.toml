# === QV-LLM:BEGIN ===
# path: pyproject.toml
# === QV-LLM:END ===

# pyproject.toml
[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

# This is a meta-package for development only, not published to PyPI
[project]
name = "quackverse"
version = "0.1.0"
description = "Development environment for QuackVerse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Rod Rivera", email = "rod@aiproduct.engineer" }
]

# Development dependencies shared across all packages
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "isort",
    "black>=23.0.0",
    "hypothesis",
]

[project.urls]
"Homepage" = "https://github.com/ducktyper-ai/quackverse"
"Bug Tracker" = "https://github.com/ducktyper-ai/quackverse/issues"

# This is the key part for monorepo support
[tool.hatch.build]
# Skip building this package, as it's just a development wrapper
skip-excluded-dirs = true
exclude = [
    "/tests",
    "/.venv",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.hypothesis",
    "/.idea",
]

# Shared configuration for all subpackages
[tool.hatch.build.targets.wheel]
packages = ["quack_core", "quackster"]

# Define no source package since this is a monorepo metapackage
[tool.hatch.build.targets.sdist]
exclude = ["*"]  # Exclude everything from the sdist

# Shared tool configurations
[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "A",   # flake8-builtins
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]  # Disable S101 (assert warning) in test files
"examples/**/*.py" = ["S101"]  # Disable S101 (assert warning) in illustrative example scripts
"quack-core/**/__init__.py" = ["N999"]  # N999: quack-core/ is a hyphenated top-level dir, not a legal Python module name -- RULING-272, structural fix routed to repo-restructure (unspawned)
"examples/http_adapter_usage.py" = ["E402"]  # E402: this file bundles three separate illustrative scripts (config sample, client example, webhook server) under "# File: examples/..." markers, each with its own module docstring and imports positioned to read correctly as a standalone script -- reordering would break the intentional per-section readability
"quack-core/src/quack_core/integrations/google/drive/protocols.py" = ["N803"]  # N803: structurally types the real googleapiclient Resource object, whose fileId keyword we do not control -- RULING-233, parallel to RULING-272's N999 disposition (formerly minted as RULING-232, re-minted per RULING-271 s3 to resolve a mint collision)
"quack-core/tests/test_integrations/google/drive/mocks/*.py" = ["N803"]  # N803: subclasses/mocks protocols.py's real-API-matching Protocol, and live tests call fileId= as a keyword today -- RULING-233

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true

[[tool.mypy.overrides]]
# RULING-251 s1 / round19: googleapiclient and google_auth_oauthlib ship no py.typed
# marker and no bundled stubs, firing an identical import-untyped finding at every one
# of their 14 import sites across the google integration's src and test trees. Scoped
# config fix, not 14 inline ignores and not a new stub-package dependency (recon ruled
# both the wrong shape) -- same precedent shape as RULING-233's per-file N803 excludes
# for the same googleapiclient boundary above.
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["quack-core/tests", "quackverse/tests", "quackster/tests"]
python_files = ["test_*.py"]
filterwarnings = ["error"]